apiVersion: v2
name: cast-operations
description: The Complete Open-Source Observability Platform
icon: https://raw.githubusercontent.com/autonomy-cloud/operations/develop/Common/UI/Images/logos/CastOperationsSVG/logo.svg
home: https://latticeruntime.com
sources:
  - https://github.com/autonomy-cloud/operations
  - https://github.com/autonomy-cloud/operations/tree/develop/HelmChart
keywords:
  - monitoring
  - observability
  - uptime
  - status-page
  - incident-management
  - on-call
  - apm
  - log-management
  - error-tracking
  - alerting
  - sre
  - opentelemetry
maintainers:
  - name: Cast Operations
    email: hello@latticeruntime.com
    url: https://latticeruntime.com

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: "11.5.12"

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: "11.5.12"

annotations:
  artifacthub.io/license: MIT
  artifacthub.io/category: monitoring-logging
  artifacthub.io/prerelease: "false"
  artifacthub.io/links: |
    - name: documentation
      url: https://latticeruntime.com/docs
    - name: source
      url: https://github.com/autonomy-cloud/operations
    - name: support
      url: https://github.com/autonomy-cloud/operations/issues
dependencies:
- name: keda
  version: "2.20.1"
  repository: "https://kedacore.github.io/charts"
  condition: keda.enabled
- name: cloudnative-pg
  version: "0.28.2"
  repository: "https://cloudnative-pg.github.io/charts"
  condition: postgresOperator.cnpg.enabled
- name: altinity-clickhouse-operator
  version: "0.27.1"
  repository: "https://helm.altinity.com/"
  condition: clickhouseOperator.altinity.enabled
