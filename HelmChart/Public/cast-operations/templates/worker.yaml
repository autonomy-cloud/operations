{{- if and $.Values.worker.enabled (not $.Values.deployment.disableDeployments) }}
# Cast Operations worker Deployment
#
# Runs the SAME image as `app` (App/Index.ts) but as the "worker" role: it
# registers the BullMQ queue consumers (telemetry ingestion processing, the
# general Worker/cron jobs, Workflow and Runbook) so that heavy queue
# processing never competes with API request handling on the app pods. The
# app pods set DISABLE_QUEUE_WORKERS=true (wired to worker.enabled) and stop
# consuming. The worker takes no external ingress traffic; it only exposes an
# HTTP port for health probes and the KEDA /metrics/queue-size endpoint.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-%s" $.Release.Name "worker"  }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ printf "%s-%s" $.Release.Name "worker"  }}
    app.kubernetes.io/part-of: cast-operations
    app.kubernetes.io/managed-by: Helm
    appname: cast-operations
    {{- if $.Values.deployment.includeTimestampLabel }}
    date: "{{ now | unixEpoch }}"
    {{- end }}
spec:
  selector:
    matchLabels:
      app: {{ printf "%s-%s" $.Release.Name "worker"  }}
  {{- if not (and $.Values.keda.enabled $.Values.worker.keda.enabled) }}
  {{- if and $.Values.worker (hasKey $.Values.worker "replicaCount") (ne $.Values.worker.replicaCount nil) }}
  replicas: {{ $.Values.worker.replicaCount }}
  {{- else }}
  {{- if or (not (eq (include "cast-operations.autoscalingEnabled" (dict "Values" $.Values "Override" $.Values.worker.autoscaling)) "true")) ($.Values.worker.disableAutoscaler) }}
  replicas: {{ $.Values.deployment.replicaCount }}
  {{- end }}
  {{- end }}
  {{- end }}
  strategy: {{- toYaml $.Values.deployment.updateStrategy | nindent 4 }}
  template:
    metadata:
      labels:
        app: {{ printf "%s-%s" $.Release.Name "worker"  }}
        {{- if $.Values.deployment.includeTimestampLabel }}
        date: "{{ now | unixEpoch }}"
        {{- end }}
        appname: cast-operations
    spec:
      {{- if $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml $.Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if $.Values.worker.podSecurityContext }}
      securityContext:
        {{- toYaml $.Values.worker.podSecurityContext | nindent 8 }}
      {{- else if $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      {{- end }}
      {{- if $.Values.worker.hostAliases }}
      hostAliases:
        {{- toYaml $.Values.worker.hostAliases | nindent 8 }}
      {{- else if $.Values.hostAliases }}
      hostAliases:
        {{- toYaml $.Values.hostAliases | nindent 8 }}
      {{- end }}
      {{- if $.Values.affinity }}
      affinity: {{- $.Values.affinity | toYaml | nindent 8 }}
      {{- end }}
      {{- if $.Values.tolerations }}
      tolerations: {{- $.Values.tolerations | toYaml | nindent 8 }}
      {{- end }}
      {{- if $.Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml $.Values.worker.nodeSelector | nindent 8 }}
      {{- else if $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml $.Values.nodeSelector | nindent 8 }}
      {{- end }}
      containers:
        - image: {{ include "cast-operations.image" (dict "Values" $.Values "ServiceName" "worker" "ImageName" "app") }}
          name: {{ printf "%s-%s" $.Release.Name "worker"  }}
          {{- if $.Values.startupProbe.enabled }}
          # Startup probe
          startupProbe:
            httpGet:
              path: /status/live
              port: {{ $.Values.worker.ports.http }}
            periodSeconds: {{ $.Values.startupProbe.periodSeconds }}
            failureThreshold: {{ $.Values.startupProbe.failureThreshold }}
          {{- end }}
          {{- if $.Values.livenessProbe.enabled }}
          # Liveness probe
          livenessProbe:
            httpGet:
              path: /status/live
              port: {{ $.Values.worker.ports.http }}
            periodSeconds: {{ $.Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ $.Values.livenessProbe.timeoutSeconds }}
            initialDelaySeconds: {{ $.Values.livenessProbe.initialDelaySeconds }}
          {{- end }}
          {{- if $.Values.readinessProbe.enabled }}
          # Readyness Probe
          readinessProbe:
            httpGet:
              path: /status/ready
              port: {{ $.Values.worker.ports.http }}
            periodSeconds: {{ $.Values.readinessProbe.periodSeconds }}
            initialDelaySeconds: {{ $.Values.readinessProbe.initialDelaySeconds }}
            timeoutSeconds: {{ $.Values.readinessProbe.timeoutSeconds }}
          {{- end }}
          {{- if $.Values.worker.containerSecurityContext }}
          securityContext:
            {{- toYaml $.Values.worker.containerSecurityContext | nindent 12 }}
          {{- else if $.Values.containerSecurityContext }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          {{- end }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            {{- include "cast-operations.env.common" . | nindent 12 }}
            {{- include "cast-operations.env.runtime" (dict "Values" $.Values "Release" $.Release "DatabaseMaxOpenConnections" ($.Values.worker.databaseMaxOpenConnections | default $.Values.deployment.databaseMaxOpenConnections)) | nindent 12 }}
            - name: PORT
              value: {{ $.Values.worker.ports.http | quote }}
            # This pod IS the worker role — it must consume the queues.
            - name: DISABLE_QUEUE_WORKERS
              value: "false"
            - name: DISABLE_TELEMETRY
              value: {{ $.Values.worker.disableTelemetryCollection | quote }}
            - name: ENABLE_PROFILING
              value: {{ $.Values.worker.enableProfiling | quote }}
            - name: TELEMETRY_CONCURRENCY
              value: {{ $.Values.worker.telemetryConcurrency | default 100 | squote }}
            {{- include "cast-operations.env.registerProbeKey" (dict "Values" $.Values "Release" $.Release) | nindent 12 }}
          ports:
            - containerPort: {{ $.Values.worker.ports.http }}
              protocol: TCP
              name: http
          {{- if $.Values.worker.resources }}
          resources:
            {{- toYaml $.Values.worker.resources | nindent 12 }}
          {{- end }}
      restartPolicy: {{ $.Values.image.restartPolicy }}

---

# Cast Operations worker autoscaler (skip HPA when KEDA is managing scaling)
{{- if and (not $.Values.worker.disableAutoscaler) (not (and $.Values.keda.enabled $.Values.worker.keda.enabled)) }}
{{- $workerAutoScalerArgs := dict "ServiceName" "worker" "Release" $.Release "Values" $.Values "Override" $.Values.worker.autoscaling -}}
{{- include "cast-operations.autoscaler" $workerAutoScalerArgs }}
{{- end }}
---
{{- end }}

{{- if and $.Values.worker.enabled (not $.Values.deployment.disableDeployments) }}
# Cast Operations worker Service (ClusterIP, http only — for health probes and the
# KEDA /metrics/queue-size endpoint; no gRPC and no external ingress).
{{- $workerPorts := dict "http" $.Values.worker.ports.http -}}
{{- $workerServiceArgs := dict "ServiceName" "worker" "Ports" $workerPorts "Release" $.Release "Values" $.Values -}}
{{- include "cast-operations.service" $workerServiceArgs }}
---
{{- end }}

{{- if and $.Values.worker.enabled (not $.Values.deployment.disableDeployments) }}
# Cast Operations worker PodDisruptionBudget
{{- include "cast-operations.pdb" (dict "ServiceName" "worker" "Override" $.Values.worker.podDisruptionBudget "Release" $.Release "Values" $.Values) }}
{{- end }}
