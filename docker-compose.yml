# Production images are published to GitHub Container Registry. Override
# CAST_OPERATIONS_IMAGE_REPOSITORY only when testing an explicitly trusted mirror.

x-common-depends-on: &common-depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  clickhouse:
    condition: service_healthy

services:
  redis:
    extends:
      file: ./docker-compose.base.yml
      service: redis

  clickhouse:
    extends:
      file: ./docker-compose.base.yml
      service: clickhouse

  postgres:
    ports:
      - "5400:5432" # for access to postgres for backups. If you don't need backup, you can comment this line out to make it more secure.
    extends:
      file: ./docker-compose.base.yml
      service: postgres

  app:
    image: ${CAST_OPERATIONS_IMAGE_REPOSITORY:-ghcr.io/autonomy-cloud/operations}/app:${APP_TAG}
    extends:
      file: ./docker-compose.base.yml
      service: app
    depends_on:
      <<: *common-depends-on

  probe-1:
    image: ${CAST_OPERATIONS_IMAGE_REPOSITORY:-ghcr.io/autonomy-cloud/operations}/probe:${APP_TAG}
    extends:
      file: ./docker-compose.base.yml
      service: probe-1
    depends_on:
      <<: *common-depends-on

  ai-agent:
    image: ${CAST_OPERATIONS_IMAGE_REPOSITORY:-ghcr.io/autonomy-cloud/operations}/ai-agent:${APP_TAG}
    extends:
      file: ./docker-compose.base.yml
      service: ai-agent
    depends_on:
      <<: *common-depends-on

  ingress:
    image: ${CAST_OPERATIONS_IMAGE_REPOSITORY:-ghcr.io/autonomy-cloud/operations}/nginx:${APP_TAG}
    extends:
      file: ./docker-compose.base.yml
      service: ingress
    depends_on:
      <<: *common-depends-on

volumes:
  postgres:
  clickhouse:

networks:
  cast-operations:
    driver: bridge
