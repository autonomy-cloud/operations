name: Publish Cast Operations release artifacts

on:
  push:
    branches:
      - "release"
  workflow_dispatch:
    inputs:
      publish_android_to_store:
        description: 'Publish Android app to Google Play Store'
        required: false
        type: boolean
        default: false
      publish_ios_to_store:
        description: 'Publish iOS app to App Store'
        required: false
        type: boolean
        default: false
      publish_terraform_provider:
        description: 'Publish the separately distributed Terraform provider'
        required: false
        type: boolean
        default: false
      build_mobile_release_artifacts:
        description: 'Build signed Android and iOS release artifacts'
        required: false
        type: boolean
        default: false

concurrency:
  group: operations-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  generate-build-number:
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.buildnumber.outputs.build_number }}
    steps:
    - name: Generate build number
      id: buildnumber
      shell: bash
      run: echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
    - run: echo "Build number is ${{ steps.buildnumber.outputs.build_number }}"


  read-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      major_minor: ${{ steps.determine.outputs.semver_base }}
      semver_base: ${{ steps.determine.outputs.semver_base }}
      major: ${{ steps.determine.outputs.major }}
      minor: ${{ steps.determine.outputs.minor }}
      patch: ${{ steps.determine.outputs.patch }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
      - name: Check version and verify not already released
        id: determine
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          VERSION_RAW="$(tr -d ' \n' < VERSION)"
          if [[ -z "$VERSION_RAW" ]]; then
            echo "VERSION is empty" >&2
            exit 1
          fi

          echo "Version from VERSION file: $VERSION_RAW"

          IFS='.' read -r major minor patch <<< "$VERSION_RAW"
          if [[ -z "$minor" ]]; then
            echo "VERSION must contain major and minor components" >&2
            exit 1
          fi
          patch="${patch:-0}"

          for part_name in major minor patch; do
            part="${!part_name}"
            if ! [[ "$part" =~ ^[0-9]+$ ]]; then
              echo "Invalid ${part_name} component '$part' in VERSION" >&2
              exit 1
            fi
          done

          # Check if this version is already released on GitHub
          echo "Checking if version $VERSION_RAW is already released on GitHub..."

          if gh release view "$VERSION_RAW" --repo "$REPOSITORY" &>/dev/null; then
            echo "::error::Version $VERSION_RAW is already released on GitHub. Please update the VERSION file to a new version."
            exit 1
          fi

          # Also check with 'v' prefix just in case
          if gh release view "v$VERSION_RAW" --repo "$REPOSITORY" &>/dev/null; then
            echo "::error::Version v$VERSION_RAW is already released on GitHub. Please update the VERSION file to a new version."
            exit 1
          fi

          # A Git tag may exist without a GitHub Release. Reusing or moving
          # that tag would make the published source ambiguous, so reject
          # both supported tag spellings before any artifact is built.
          for tag in "$VERSION_RAW" "v$VERSION_RAW"; do
            if gh api "repos/$REPOSITORY/git/ref/tags/$tag" &>/dev/null; then
              echo "::error::Git tag $tag already exists. Please update the VERSION file to a new version."
              exit 1
            fi
          done

          echo "✅ Version $VERSION_RAW is not yet released. Proceeding with release."

          echo "semver_base=${VERSION_RAW}" >> "$GITHUB_OUTPUT"
          echo "major=${major}" >> "$GITHUB_OUTPUT"
          echo "minor=${minor}" >> "$GITHUB_OUTPUT"
          echo "patch=${patch}" >> "$GITHUB_OUTPUT"
          echo "Using version: ${VERSION_RAW}"

      - name: Verify package.json versions match VERSION
        run: node ./Scripts/Install/SyncPackageVersions.js --check



  helm-chart-deploy:
    runs-on: ubuntu-latest
    needs: [generate-build-number, read-version]
    permissions:
      contents: read
      packages: write
    outputs:
      chart_digest: ${{ steps.publish.outputs.cast_operations_digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Authenticate to the Autonomy Cloud chart registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Validate, package, and publish immutable Helm charts
        id: publish
        env:
          VERSION: ${{ needs.read-version.outputs.major_minor }}
        run: |
          set -euo pipefail
          mkdir -p dist/helm
          for chart in cast-operations kubernetes-agent; do
            chart_path="HelmChart/Public/$chart"
            helm dependency update "$chart_path"
            helm lint "$chart_path"
            helm template "$chart" "$chart_path" >/dev/null
            helm package "$chart_path" \
              --version "$VERSION" \
              --app-version "$VERSION" \
              --destination dist/helm
            # Why: LatticeRuntime pins the chart by immutable digest, so capture
            # the digest helm reports at push time rather than re-resolving a
            # mutable version tag later.
            push_log="$(mktemp)"
            helm push "dist/helm/$chart-$VERSION.tgz" oci://ghcr.io/autonomy-cloud/charts 2>&1 | tee "$push_log"
            if [ "$chart" = "cast-operations" ]; then
              digest="$(awk '/^Digest: sha256:/ {print $2; exit}' "$push_log")"
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
                echo "::error::Could not resolve the immutable cast-operations chart digest."
                exit 1
              }
              echo "cast_operations_digest=$digest" >>"$GITHUB_OUTPUT"
            fi
          done

  # ─── Docker image build jobs (per-arch matrix) ───────────────────────

  nginx-docker-image-build:
    needs: [generate-build-number, read-version]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: >-
            image=mirror.gcr.io/moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Generate Dockerfile from Dockerfile.tpl
        run: npm run prerun

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.repository_owner }}" --password-stdin

      - name: Build and push
        run: |
          bash ./Scripts/GHA/build_docker_images.sh \
            --image nginx \
            --version "${{needs.read-version.outputs.major_minor}}" \
            --dockerfile ./Nginx/Dockerfile \
            --context . \
            --platforms ${{ matrix.platform }} \
            --git-sha "${{ github.sha }}"

  nginx-docker-image-merge:
    needs: [nginx-docker-image-build, read-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: >-
            image=mirror.gcr.io/moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.repository_owner }}" --password-stdin

      - name: Merge multi-arch manifests
        run: |
          VERSION="${{needs.read-version.outputs.major_minor}}"
          SANITIZED_VERSION="${VERSION//+/-}"
          bash ./Scripts/GHA/merge_docker_manifests.sh \
            --image nginx \
            --tags "${SANITIZED_VERSION}"

