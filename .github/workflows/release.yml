        id: merge
        run: |
          set -euo pipefail
          VERSION="${{needs.read-version.outputs.major_minor}}"
          SANITIZED_VERSION="${VERSION//+/-}"
          bash ./Scripts/GHA/merge_docker_manifests.sh \
            --image app \
            --tags "${SANITIZED_VERSION}"
          # Why: LatticeRuntime pins operations/app by digest in four places, so
