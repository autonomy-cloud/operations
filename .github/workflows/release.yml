      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.repository_owner }}" --password-stdin

      - name: Create GHCR release tag from version
        run: |
          VERSION="${{needs.read-version.outputs.major_minor}}"
          docker buildx imagetools create \
            --tag ghcr.io/autonomy-cloud/operations/${{ matrix.image }}:release \
            ghcr.io/autonomy-cloud/operations/${{ matrix.image }}:${VERSION}

  test-e2e-release-saas:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    needs: [ai-agent-docker-image-merge, app-docker-image-merge, home-docker-image-merge, probe-docker-image-merge, runbook-agent-docker-image-merge, test-docker-image-merge, test-server-docker-image-merge, verify-npm-packages, e2e-docker-image-merge, helm-chart-deploy, generate-build-number, read-version, nginx-docker-image-merge, release-oci-supply-chain]
    env:
      CI_PIPELINE_ID: ${{github.run_number}}
    steps:
      # Aggressively free disk space before anything else
      - name: Aggressive Disk Cleanup
        run: |
          echo "=== Disk space BEFORE cleanup ==="
          df -h /
          # Purge apt-installed packages before rm-ing their files so dpkg state stays consistent.
          # Otherwise a later `apt-get install` triggers reconfiguration of half-removed packages
          # (e.g. google-cloud-cli's postinst calls /usr/bin/gcloud) and fails with exit 100.
          sudo DEBIAN_FRONTEND=noninteractive apt-get purge -y \
            google-cloud-cli \
            azure-cli \
            firefox \
            powershell \
            mono-devel \
            google-chrome-stable 2>/dev/null || true
          # Remove pre-installed software not needed for this job
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/graalvm/ || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/share/miniconda || true
          sudo rm -rf /usr/lib/google-cloud-sdk || true
          sudo rm -rf /usr/lib/jvm || true
          sudo rm -rf /usr/lib/firefox || true
          sudo rm -rf /usr/lib/heroku || true
          sudo rm -rf /usr/local/julia* || true
          sudo rm -rf /opt/az || true
          sudo rm -rf /opt/microsoft || true
          sudo rm -rf /opt/pipx || true
          sudo rm -rf /opt/actionarchivecache || true
          sudo rm -rf /imagegeneration || true
          sudo rm -rf /usr/share/az_* || true
          sudo rm -rf /usr/share/sbt || true
          sudo rm -rf /usr/share/gradle* || true
          sudo rm -rf /usr/share/kotlinc || true
          sudo rm -rf /usr/share/ri || true
          sudo rm -rf /usr/local/.ghcup || true
          # Repair any dpkg state left half-broken by the rm operations above
          sudo dpkg --configure -a 2>/dev/null || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get --fix-broken install -y 2>/dev/null || true
          # Clean apt cache
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          # Clean temp files
          sudo rm -rf /tmp/* || true
          # Docker cleanup
          docker system prune -af --volumes || true
          echo "=== Disk space AFTER aggressive cleanup ==="
          df -h /
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Final Disk Space Check
        run: |
          echo "=== Disk space after all cleanup ==="
          df -h /
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Preinstall
        run: npm run prerun
      - name: Pin APP_TAG to versioned release
        run: |
          VERSION="${{needs.read-version.outputs.major_minor}}"
          SANITIZED_VERSION="${VERSION//+/-}"
          if [ -f config.env ]; then
            if grep -q '^APP_TAG=' config.env; then
              sed -i "s/^APP_TAG=.*/APP_TAG=${SANITIZED_VERSION}/" config.env
            else
              echo "APP_TAG=${SANITIZED_VERSION}" >> config.env
            fi
          else
            echo "APP_TAG=${SANITIZED_VERSION}" > config.env
          fi
      - name: Verify release image contract
        run: bash ./Tests/Scripts/verify-release-images.sh "${{needs.read-version.outputs.major_minor}}"
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start Server with version tag
        run: |
          set -a
          source config.env
          set +a
          export APP_TAG=${{needs.read-version.outputs.major_minor}}
          docker compose up --remove-orphans -d
          npm run status-check
      - name: Wait for server to start
        run: bash ./Tests/Scripts/status-check.sh http://localhost
      - name: Pull E2E test image
        run: |
          set -euo pipefail
          set -a
          source config.env
          set +a
          export APP_TAG=${{needs.read-version.outputs.major_minor}}
          docker compose -f docker-compose.e2e.yml pull e2e
      - name: Run E2E Tests. Run docker container e2e in docker compose file
        run: |
          set -euo pipefail
          set -a
          source config.env
          set +a
          export APP_TAG=${{needs.read-version.outputs.major_minor}}
          trap 'docker compose -f docker-compose.e2e.yml down -v || true' EXIT
          if ! docker compose -f docker-compose.e2e.yml up --exit-code-from e2e --abort-on-container-exit e2e; then
            docker compose -f docker-compose.e2e.yml logs e2e
            exit 1
          fi
      - name: Upload test results
        uses: actions/upload-artifact@v4
        # Run this on failure
        if: failure()
        with:
          # Name of the artifact to upload.
          # Optional. Default is 'artifact'
          name: test-results-${{ github.job }}-${{ github.run_attempt }}

          # A file, directory or wildcard pattern that describes what to upload
          # Required.
          path: |
            ./E2E


          # Duration after which artifact will expire in days. 0 means using default retention.
          # Minimum 1 day.
          # Maximum 90 days unless changed from the repository settings page.
          # Optional. Defaults to repository settings.
          retention-days: 7


