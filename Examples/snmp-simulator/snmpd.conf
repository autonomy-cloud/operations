agentAddress udp:0.0.0.0:161

# SNMP v1/v2c
rocommunity public default

# SNMPv3: user "cast-operations", auth SHA / priv AES (matches Cast Operations’
# SnmpAuthProtocol.SHA and SnmpPrivProtocol.AES options), level authPriv.
createUser cast-operations SHA authpass123 AES privpass123
rouser cast-operations priv

sysName router-v3
sysLocation Simulator lab, rack 3
sysContact noc@example.com
sysServices 72
